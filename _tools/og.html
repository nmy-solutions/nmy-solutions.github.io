<html lang="uk">
<meta charset="utf-8">
<style>
@font-face{font-family:M;font-weight:700 900;src:url(../fonts/montserrat-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:M;font-weight:700 900;src:url(../fonts/montserrat-cyrillic.woff2) format("woff2");unicode-range:U+0400-045F,U+0490-0491}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;padding:70px 72px;background:#f3f3f1;color:#111;font-family:M,sans-serif;display:flex;flex-direction:column;position:relative;overflow:hidden}
body::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#e4e4df 1px,transparent 1px),linear-gradient(90deg,#e4e4df 1px,transparent 1px);background-size:56px 56px;opacity:.7}
body>*{position:relative}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:baseline;gap:8px}
.logo b{font:900 56px/1 M;letter-spacing:-.03em}
.logo small{font:800 18px/1 M;letter-spacing:.22em;color:#55555a}
.red{color:#e11d2a}
.label{font:800 18px/1 M;letter-spacing:.16em;text-transform:uppercase}
h1{margin-top:auto;font:900 98px/1.06 M;letter-spacing:-.02em}
.hl{position:relative;white-space:nowrap}
.hl svg{position:absolute;left:-3%;bottom:-.16em;width:106%;height:.3em;color:#e11d2a;overflow:visible}
.pills{display:flex;gap:14px;margin-top:44px}
.pills span{padding:15px 20px;border-radius:8px;background:#111;color:#fff;font:800 22px/1 M}
.pills span:first-child{background:#e11d2a}
</style>
<div class="top">
  <div class="logo"><b><span class="red">N</span>MY</b><small>AGENCY</small></div>
  <div class="label">Розробка на замовлення</div>
</div>
<h1>Робимо системи<br>для <span class="hl">вашого<svg viewBox="0 0 300 24" preserveAspectRatio="none"><path d="M5 17C70 7 190 3 295 12" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/></svg></span><br>бізнесу.</h1>
<div class="pills"><span>Фіксована ціна</span><span>Увесь код — ваш</span><span>Безпечний хостинг</span></div>
